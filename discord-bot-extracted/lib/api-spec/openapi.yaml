openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Bot dashboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/auth:
    post:
      operationId: dashboardAuth
      tags: [dashboard]
      summary: Authenticate to the dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid password

  /dashboard/guilds:
    get:
      operationId: listGuilds
      tags: [dashboard]
      summary: List all guilds the bot is in
      responses:
        "200":
          description: List of guilds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guild"

  /dashboard/guilds/{guildId}:
    get:
      operationId: getGuild
      tags: [dashboard]
      summary: Get guild overview with channels and roles
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guild detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildDetail"
        "404":
          description: Guild not found

  /dashboard/guilds/{guildId}/welcome:
    get:
      operationId: getWelcomeConfig
      tags: [dashboard]
      summary: Get welcome message config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Welcome config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeConfig"
    put:
      operationId: upsertWelcomeConfig
      tags: [dashboard]
      summary: Set or update welcome message config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WelcomeConfigInput"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteWelcomeConfig
      tags: [dashboard]
      summary: Disable welcome messages
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/leave:
    get:
      operationId: getLeaveConfig
      tags: [dashboard]
      summary: Get leave message config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Leave config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveConfig"
    put:
      operationId: upsertLeaveConfig
      tags: [dashboard]
      summary: Set or update leave message config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveConfigInput"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteLeaveConfig
      tags: [dashboard]
      summary: Disable leave messages
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/modlog:
    get:
      operationId: getModlogConfig
      tags: [dashboard]
      summary: Get modlog channel config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Modlog config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModlogConfig"
    put:
      operationId: upsertModlogConfig
      tags: [dashboard]
      summary: Set modlog channel
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModlogConfigInput"
      responses:
        "200":
          description: Updated

  /dashboard/guilds/{guildId}/ticket:
    get:
      operationId: getTicketConfig
      tags: [dashboard]
      summary: Get ticket system config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketConfig"
    patch:
      operationId: updateTicketConfig
      tags: [dashboard]
      summary: Update ticket system config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketConfigInput"
      responses:
        "200":
          description: Updated

  /dashboard/guilds/{guildId}/triggers:
    get:
      operationId: listTriggers
      tags: [dashboard]
      summary: List all auto-triggers for a guild
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of triggers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trigger"
    post:
      operationId: createTrigger
      tags: [dashboard]
      summary: Add a new auto-trigger
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trigger"

  /dashboard/guilds/{guildId}/triggers/{triggerId}:
    delete:
      operationId: deleteTrigger
      tags: [dashboard]
      summary: Remove a trigger
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
        - name: triggerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/rr:
    get:
      operationId: listReactionRoles
      tags: [dashboard]
      summary: List all reaction roles for a guild
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reaction roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReactionRole"
    post:
      operationId: createReactionRole
      tags: [dashboard]
      summary: Add a reaction role
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRoleInput"
      responses:
        "201":
          description: Created

  /dashboard/guilds/{guildId}/rr/{messageId}/{emoji}:
    delete:
      operationId: deleteReactionRole
      tags: [dashboard]
      summary: Remove a reaction role
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/noprefix:
    get:
      operationId: getNoPrefixConfig
      tags: [dashboard]
      summary: Get no-prefix role config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: No-prefix config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoPrefixConfig"
    put:
      operationId: upsertNoPrefixConfig
      tags: [dashboard]
      summary: Set the no-prefix role
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoPrefixConfigInput"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteNoPrefixConfig
      tags: [dashboard]
      summary: Remove the no-prefix role
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/vanityrole:
    get:
      operationId: getVanityRoleConfig
      tags: [dashboard]
      summary: Get vanity role config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vanity role config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VanityRoleConfig"
    put:
      operationId: upsertVanityRoleConfig
      tags: [dashboard]
      summary: Set the vanity role config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VanityRoleConfigInput"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteVanityRoleConfig
      tags: [dashboard]
      summary: Disable vanity role
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/livelbconfig:
    get:
      operationId: getLiveLbConfig
      tags: [dashboard]
      summary: Get live leaderboard config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Live LB config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveLbConfig"
    put:
      operationId: upsertLiveLbConfig
      tags: [dashboard]
      summary: Set live leaderboard config
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveLbConfigInput"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteLiveLbConfig
      tags: [dashboard]
      summary: Disable live leaderboard
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /dashboard/guilds/{guildId}/cases:
    get:
      operationId: listCases
      tags: [dashboard]
      summary: Get recent moderation cases for a guild
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModCase"

  /dashboard/guilds/{guildId}/stats:
    get:
      operationId: getGuildStats
      tags: [dashboard]
      summary: Get aggregated stats for the guild overview card
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AuthResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Guild:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]
        memberCount:
          type: integer

    GuildDetail:
      type: object
      required: [id, name, channels, roles]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]
        memberCount:
          type: integer
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelInfo"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"

    ChannelInfo:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: integer

    RoleInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer

    GuildStats:
      type: object
      required: [totalCases, totalWarnings, totalTriggers, totalReactionRoles]
      properties:
        totalCases:
          type: integer
        totalWarnings:
          type: integer
        totalTriggers:
          type: integer
        totalReactionRoles:
          type: integer
        wordbombTopPlayers:
          type: integer

    WelcomeConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        channelId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]

    WelcomeConfigInput:
      type: object
      required: [channelId, message]
      properties:
        channelId:
          type: string
        message:
          type: string

    LeaveConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        channelId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]

    LeaveConfigInput:
      type: object
      required: [channelId, message]
      properties:
        channelId:
          type: string
        message:
          type: string

    ModlogConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        channelId:
          type: ["string", "null"]

    ModlogConfigInput:
      type: object
      required: [channelId]
      properties:
        channelId:
          type: string

    TicketConfig:
      type: object
      required: [enabled, count]
      properties:
        enabled:
          type: boolean
        panelChannelId:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        supportRoleId:
          type: ["string", "null"]
        logChannelId:
          type: ["string", "null"]
        count:
          type: integer

    TicketConfigInput:
      type: object
      properties:
        categoryId:
          type: ["string", "null"]
        supportRoleId:
          type: ["string", "null"]
        logChannelId:
          type: ["string", "null"]

    Trigger:
      type: object
      required: [triggerId, keyword, type, value, exact]
      properties:
        triggerId:
          type: string
        keyword:
          type: string
        type:
          type: string
        value:
          type: string
        exact:
          type: boolean

    TriggerInput:
      type: object
      required: [keyword, type, value]
      properties:
        keyword:
          type: string
        type:
          type: string
        value:
          type: string
        exact:
          type: boolean

    ReactionRole:
      type: object
      required: [messageId, emoji, channelId, roleId]
      properties:
        messageId:
          type: string
        emoji:
          type: string
        channelId:
          type: string
        roleId:
          type: string

    ReactionRoleInput:
      type: object
      required: [messageId, emoji, channelId, roleId]
      properties:
        messageId:
          type: string
        emoji:
          type: string
        channelId:
          type: string
        roleId:
          type: string

    NoPrefixConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        roleId:
          type: ["string", "null"]

    NoPrefixConfigInput:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string

    VanityRoleConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        roleId:
          type: ["string", "null"]
        code:
          type: ["string", "null"]

    VanityRoleConfigInput:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
        code:
          type: ["string", "null"]

    LiveLbConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        channelId:
          type: ["string", "null"]
        stat:
          type: ["string", "null"]
        period:
          type: ["string", "null"]

    LiveLbConfigInput:
      type: object
      required: [channelId, stat, period]
      properties:
        channelId:
          type: string
        stat:
          type: string
        period:
          type: string

    ModCase:
      type: object
      required: [caseId, type, targetId, targetTag, moderatorId, reason, timestamp]
      properties:
        caseId:
          type: integer
        type:
          type: string
        targetId:
          type: string
        targetTag:
          type: string
        moderatorId:
          type: string
        reason:
          type: string
        timestamp:
          type: integer
